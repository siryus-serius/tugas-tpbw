name: Satellite & Sensor Data Fetcher (GitHub Machine)

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Memungkinkan pengguna menjalankan penarikan data secara manual kapan saja dari tab Actions di GitHub

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Eksekusi Mesin Penarik Data Satelit & Sensor (BMKG, Open-Meteo, RainViewer)
        run: |
          node scripts/github_machine_fetcher.js

      - name: Simpan & Dorong Data Terbaru ke Repositori
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Documents/WebGIS/jabar-landslide/public/data/live-telemetry.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): pembaruan otomatis telemetri satelit & sensor [skip ci]" && git push)
