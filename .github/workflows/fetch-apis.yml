name: Fetch API Data Every 10 Minutes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch data from APIs
        env:
          API_URL_1: ${{ secrets.API_URL_1 }}
          API_URL_2: ${{ secrets.API_URL_2 }}
          API_URL_3: ${{ secrets.API_URL_3 }}
          API_TOKEN_1: ${{ secrets.API_TOKEN_1 }}
          API_TOKEN_2: ${{ secrets.API_TOKEN_2 }}
          API_TOKEN_3: ${{ secrets.API_TOKEN_3 }}
        run: node scripts/fetch-apis.js

      - name: Commit and push data snapshots
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data Documents/WebGIS/jabar-landslide/public/data
          git diff --cached --quiet || git commit -m "chore(data): perbarui snapshot data cuaca & telemetri API [skip ci]"
          git push
