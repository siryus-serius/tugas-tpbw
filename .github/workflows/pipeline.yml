name: Pipeline WebGIS Longsor Jabar

# Satu pipeline untuk seluruh otomatisasi:
#   data   → (jadwal bulanan / manual) jalankan scripts/pipeline.js, commit JSON/PNG hasil
#            * gerbang bulanan: bila data bulan (WIB) ini sudah ada → tidak ada proses & upload
#            * tahap validate wajib lolos (tanpa "gagal") → baru boleh commit
#   build  → lint + build frontend (setiap push/PR, dan setelah data diperbarui)
#   deploy → GitHub Pages (main saja)
#
# Anti-konflik commit:
#   - satu grup concurrency untuk main → tidak ada dua run yang menulis bersamaan
#   - hanya job "data" yang commit, dengan pull --rebase + retry sebelum push
#   - commit bot memakai GITHUB_TOKEN sehingga tidak memicu run baru (tidak ada loop)
# Gempa terkini BMKG diambil langsung oleh browser → tidak ada commit data harian.
# Login Google Earth Engine tanpa file kunci (Workload Identity Federation) memakai repository
# variables GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, GEE_PROJECT. Tidak ada secret.
# Prasyarat sekali saja: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'Documents/WebGIS/jabar-landslide/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/pipeline.yml'
  pull_request:
    paths:
      - 'Documents/WebGIS/jabar-landslide/**'
      - 'scripts/**'
  schedule:
    - cron: '0 20 1 * *' # tanggal 2 tiap bulan, 03:00 WIB
  workflow_dispatch:
    inputs:
      stage:
        description: 'Tahap pipeline data (kosongkan untuk lewati)'
        type: choice
        options: [all, events, insar, quakes, validate, gee-check, none]
        default: all
      force:
        description: 'Paksa pembaruan walau bulan belum berganti'
        type: boolean
        default: false

concurrency:
  group: pipeline-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: Documents/WebGIS/jabar-landslide

jobs:
  data:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage != 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write # untuk Workload Identity Federation (login GEE)
    steps:
      - uses: actions/checkout@v4

      - name: Login Google Cloud (Earth Engine) tanpa kunci
        id: gcp
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/earthengine,https://www.googleapis.com/auth/cloud-platform

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pulihkan cache kecepatan InSAR per tahun
        uses: actions/cache@v4
        with:
          path: data/insar/cache
          key: insar-cache-${{ github.run_id }}
          restore-keys: insar-cache-

      - name: Jalankan pipeline data (gerbang bulanan + validasi)
        id: pipe
        env:
          GEE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GEE_PROJECT: ${{ vars.GEE_PROJECT }}
        run: node scripts/pipeline.js ${{ inputs.stage || 'all' }} --monthly ${{ inputs.force && '--force' || '' }}

      - name: Commit hasil (hanya bila ada pembaruan bulan baru yang lolos validasi)
        if: steps.pipe.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR/public/data/sentinel_events.json" "$APP_DIR/public/data/insar"                   "$APP_DIR/public/data/gempa_usgs.geojson" "$APP_DIR/public/data/validation.json"
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "chore(data): pembaruan bulanan $(TZ=Asia/Jakarta date +%Y-%m)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "Gagal push setelah 3 percobaan" && exit 1

  build:
    needs: data
    # Tetap jalan bila job data dilewati (push/PR), tapi tidak bila data gagal
    if: always() && needs.data.result != 'failure' && needs.data.result != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Setelah job data, ambil main terbaru agar commit data ikut ter-build
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
