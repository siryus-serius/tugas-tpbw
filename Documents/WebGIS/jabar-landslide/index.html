<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGIS Kerawanan Longsor Jawa Barat (2021–2025)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
    <!-- SVG Colormap Filters for Satellite Slope & Terrain -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none; width: 0; height: 0; position: absolute;">
      <defs>
        <!-- Slope Hazard RGB Gradient (Super Vivid / Ngejreng) -->
        <filter id="slope-rgb-gradient" color-interpolation-filters="sRGB">
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0.0 0.15 0.95 1.0 1.0 0.85" />
            <feFuncG type="table" tableValues="0.95 1.0 0.90 0.38 0.05 0.0" />
            <feFuncB type="table" tableValues="0.35 0.05 0.0 0.0 0.08 0.15" />
            <feFuncA type="linear" slope="5.5" intercept="-0.01" />
          </feComponentTransfer>
        </filter>

        <!-- DEM Elevation Gradient: Dataran Rendah -> Perbukitan -> Pegunungan Tinggi -->
        <filter id="dem-terrain-gradient" color-interpolation-filters="sRGB">
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0.10 0.30 0.70 0.88 0.98" />
            <feFuncG type="table" tableValues="0.55 0.78 0.68 0.55 0.98" />
            <feFuncB type="table" tableValues="0.35 0.25 0.22 0.35 0.98" />
            <feFuncA type="linear" slope="2.5" intercept="0" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
